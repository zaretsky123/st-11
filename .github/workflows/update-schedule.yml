name: Обновление расписания СТ-11

on:
  schedule:
    # 06:17 по Москве. Не используем начало часа, когда GitHub Actions перегружен.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: st11-schedule-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  update:
    name: Получить расписание МГТУ
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Подготовить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Получить и проверить расписание
        run: python scripts/update_schedule.py

      - name: Проверить изменения
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- schedule-data.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Сохранить новое расписание
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule-data.js
          git commit -m "Автоматически обновить расписание СТ-11"
          git push

      - name: Обновить GitHub Pages
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
